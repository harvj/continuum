<!doctype html>
<!-- Offline Rails render. Artwork and favicon are read from the sibling Site Art checkout. -->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Intelligence · Continuum</title>
        <link rel="icon" href="../../../site-art/favicons/continuum/intelligence/favicon.svg" type="image/svg+xml" sizes="any">
    <style>
@font-face {
  font-family: "DM Sans";
  src: url("../../public/identity/dm-sans.woff2") format("woff2");
  font-weight: 400 600;
  font-display: swap;
}
* { box-sizing: border-box; }
body {
  --surface: #f3f3f1;
  --ink: #243b44;
  margin: 0;
  min-height: 100svh;
  display: flex;
  flex-direction: column;
  isolation: isolate;
  background: var(--surface);
  color: var(--ink);
  font-family: "DM Sans", system-ui, sans-serif;
}
body.library { --surface: #f6f5f2; --ink: #38332c; }
body.intelligence { --surface: #24272a; --ink: #f7f6f2; }
.background {
  visibility: hidden;
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  z-index: -1;
}
body[data-art-ready] .background { visibility: visible; }
header {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  column-gap: 1rem;
  padding: 24px 6.5vw 0;
}
a { color: inherit; text-decoration: none; }
a:active { text-decoration: underline; }
a:focus-visible { outline: 2px solid currentColor; outline-offset: -2px; }
.wordmark { font-size: 24px; font-weight: 600; letter-spacing: -1.2px; line-height: 1.2; }
nav { display: flex; align-items: center; flex-wrap: wrap; gap: 12px; margin-left: auto; font-size: 14px; }
nav a { display: inline-flex; align-items: center; min-width: 44px; min-height: 44px; justify-content: center; }
nav a:hover, nav a[aria-current="page"] { text-decoration: underline; text-underline-offset: .35em; }
main { flex: 1; }
footer { align-self: center; padding: 10px 16px; margin-bottom: 14px; font-size: 13px; }
body[data-foreground="dark"] { --surface: #f7f6f2; --ink: #24272a; }
body[data-foreground="light"] { --surface: #24272a; --ink: #f7f6f2; }
[data-art-role] {
  color: var(--art-foreground, var(--ink));
  text-shadow: var(--art-text-shadow, none);
}
footer { background-color: var(--art-backing, transparent); }
body[data-art-ready] header a:focus-visible { box-shadow: 0 0 0 1px var(--surface); }
@media (forced-colors: active) {
  [data-art-role] { color: CanvasText; text-shadow: none; }
  .background { display: none; }
  footer { background-color: transparent; }
}
@media (max-width: 480px) {
  header { padding: 16px 16px 0; column-gap: 8px; }
  nav { gap: 7px; }
  .wordmark { font-size: 23px; }
}
    </style>
      <script src="../../public/site-art.js" defer></script>
  </head>
  <body class="intelligence">
      <img class="background" src="../../../site-art/backgrounds/continuum/intelligence.png" alt="" aria-hidden="true" data-art-presentation="{&quot;default&quot;:{&quot;--art-foreground&quot;:&quot;#242321&quot;},&quot;top&quot;:{&quot;--art-foreground&quot;:&quot;#242321&quot;},&quot;bottom&quot;:{&quot;--art-foreground&quot;:&quot;#FFF8EC&quot;,&quot;--art-text-shadow&quot;:&quot;0px 1px 3px rgb(22 20 18 / 95%)&quot;}}" data-art-legacy="dark">
    <header data-art-role="top">
      <a class="wordmark" href="https://harvj.com">harvj.</a>
      <nav aria-label="Primary">
          <a href="https://network.harvj.com/">Network</a>
          <a href="https://library.harvj.com/">Library</a>
          <a aria-current="page" href="https://intelligence.harvj.com/">Intelligence</a>
        <a href="https://auth.harvj.com" aria-label="Home">
          <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>
          </svg>
        </a>
      </nav>
    </header>
    <main data-art-role="default" aria-label="Intelligence"></main>
    <footer data-art-role="bottom">© 2026 Jim Harvey · Continuum v0.1.2</footer>
  </body>
</html>
